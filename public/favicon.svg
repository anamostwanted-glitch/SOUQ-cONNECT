<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Neural Connection Nodes & Paths (Stylized S & C) -->
  <g filter="url(#glow)">
    <!-- Main Interlocking Connection Path -->
    <path d="M140 180 C140 120, 240 110, 320 150 C380 180, 380 250, 280 270 C180 290, 160 350, 240 390 C320 420, 380 370, 380 340" 
          fill="none" stroke="url(#brandGrad)" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Neural Nodes -->
    <circle cx="140" cy="180" r="24" fill="#38BDF8"/>
    <circle cx="380" cy="340" r="24" fill="#A855F7"/>
    <circle cx="280" cy="270" r="28" fill="#6366F1"/>
    <circle cx="280" cy="270" r="14" fill="#FFFFFF"/>
    <circle cx="320" cy="150" r="18" fill="#38BDF8"/>
    <circle cx="240" cy="390" r="18" fill="#C084FC"/>
  </g>
</svg>
